services:
  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.23.0
    ports:
      - "127.0.0.1:16686:16686"  # Jaeger 网页
  flask-app:
    build: .
    ports:
      - "127.0.0.1:5083:5000"  # 本机网页 5083 -> 容器 5000
    environment:
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      - jaeger
